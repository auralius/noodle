; ============================================================
; Noodle Case Study 3 - LeNet-5 on STM32F103C8T6 Blue Pill
;
; Two environments only:
;   bluepill_int8          : packed INT8 SD files, automatic safe
;                           INT32 accumulation, 128-byte FCN block
;   bluepill_fp32 (default): same serial sender, optimized FP32
;
; Shared compiler optimizations are enabled for BOTH environments.
; No separate Case 1 optimization environment is needed.
;
; NOTE: Automatic safe INT32 accumulation is implemented in the
;       patched Noodle library (no accumulator build flag needed).
;       SPI/SD frequency is configured in the firmware source, not here.
; ============================================================

[platformio]
default_envs = bluepill_fp32

[env]
platform = ststm32
board = bluepill_f103c8
framework = arduino

lib_deps =
    greiman/SdFat @ ^2.2.3
    symlink:///home/auralius/works/noodle

build_flags =
    -D NOODLE_USE_SDFAT
    -D NOODLE_POOL_MODE=NOODLE_POOL_MEAN
    -D NOODLE_FILE_FORMAT=NOODLE_FILE_FORMAT_BIN
    -D NOODLE_MAX_K=5
    -D NOODLE_FCN_BLOCK=128
    -Os
    -flto
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

build_unflags =
    -O2

upload_protocol = serial
monitor_port = /dev/ttyUSB0
monitor_speed = 115200

; Packed INT8: 14 model files on SD, 128-byte SRAM FCN weight buffer.
; The patched Noodle library automatically selects bounded INT32 MACs (INT8 only).
[env:bluepill_int8]
build_src_filter =
    -<*>
    ;+<main-int8-sram.cpp>
    +<main-int8.cpp>
    +<noodle_serial.cpp>
build_flags =
    ${env.build_flags}
    -D NOODLE_USE_INT8
    -D NOODLE_INT8_FCN_BLOCK=128
    ;-D NOODLE_CASE3_INT8_SRAM_PROBE=1

; FP32 reference: same source, now compiled using shared optimizations.
[env:bluepill_fp32]
build_src_filter =
    -<*>
    +<main-fp32.cpp>
    +<noodle_serial.cpp>
build_flags =
    ${env.build_flags}
    -D NOODLE_USE_FLOAT32
    -D NOODLE_BUFFER_ARENA_INITIAL_BYTES=9440
