; ============================================================
; Noodle Case Study 3: LeNet-5 / STM32F103C8T6 Blue Pill
;
; Two separate firmware builds:
;   bluepill_int8  -> src/main-int8.cpp       (development target)
;   bluepill_fp32  -> src/main-blue-pill.cpp  (working baseline)
;
; Only one build is programmed into the MCU at a time.
; The SD parameter formats are NOT interchangeable.
; ============================================================

[platformio]
default_envs = bluepill_int8

; ------------------------------------------------------------
; Common hardware / library configuration
; ------------------------------------------------------------
[env]
platform = ststm32
board = bluepill_f103c8
framework = arduino

lib_deps =
    greiman/SdFat @ ^2.2.3
    symlink:///home/auralius/works/noodle

build_flags =
    -D NOODLE_USE_SDFAT
    -D NOODLE_POOL_MODE=NOODLE_POOL_MEAN
    -D NOODLE_FILE_FORMAT=NOODLE_FILE_FORMAT_BIN
    -D NOODLE_MAX_K=5
    -D NOODLE_FCN_BLOCK=128

upload_protocol = stlink
monitor_port = /dev/ttyUSB0
monitor_speed = 115200

; ------------------------------------------------------------
; INT8 -- implement and benchmark first
; SD root: split conv 01/02 w,b,m,s + packed FC 03..05 w,p
; ------------------------------------------------------------
[env:bluepill_int8]
build_flags =
    ${env.build_flags}
    -D NOODLE_USE_INT8

build_src_filter =
    -<*>
    +<main-int8.cpp>
    +<noodle_serial.cpp>

; ------------------------------------------------------------
; FP32 -- preserve current working reference firmware
; SD root: w01..05.bin, b01..05.bin
; ------------------------------------------------------------
[env:bluepill_fp32]
build_flags =
    ${env.build_flags}
    -D NOODLE_USE_FLOAT32

build_src_filter =
    -<*>
    +<main-blue-pill.cpp>
    +<noodle_serial.cpp>
