; ============================================================
; INT8 configurations
; ============================================================

[env:case2-sd4-control]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_deps =
    greiman/SdFat @ ^2.2.3
    symlink:///home/auralius/works/noodle
build_src_filter =
    -<*>
    +<main-int8.cpp>
build_flags =
    -Os
    -flto
    -ffunction-sections
    -fdata-sections
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_PROGMEM
    -D NOODLE_USE_INT8
    -D NOODLE_USE_SDFAT
    -D NOODLE_FILE_FORMAT=1
    -D NOODLE_POOL_MODE=NOODLE_POOL_MEAN
    -D NOODLE_INT8_FCN_BLOCK=16
    -D NOODLE_INT8_CONV_IMPL=0
    -D NOODLE_INT8_PW_IMPL=0
    -D NOODLE_SD_CS=53
    -D NOODLE_INT8_CONV_ACC32=1
    -D NOODLE_INT8_SD_POINTWISE_ROWBUF=1
    -D NOODLE_INT8_SD_KROW_CACHE=1
    -D NOODLE_INT8_SD_KROW_MAX_BYTES=512
    -D CASE2_B6_RAM=1
build_unflags = -O2
board_build.extra_flags = -Wl,--gc-sections

[env:case2-sd8]
extends = env:case2-sd4-control
build_flags =
    ${env:case2-sd4-control.build_flags}
    -D NOODLE_SD_SCK_MHZ=8

[env:case2-sd4-no-delete]
extends = env:case2-sd4-control
build_flags =
    ${env:case2-sd4-control.build_flags}
    -D NOODLE_INT8_SD_NO_PREDELETE=1

[env:case2-sd4-identity]
extends = env:case2-sd4-control
build_flags =
    ${env:case2-sd4-control.build_flags}
    -D NOODLE_INT8_FUSED_IDENTITY_FAST=1

[env:case2-sd8-all]
extends = env:case2-sd4-control
build_flags =
    ${env:case2-sd4-control.build_flags}
    -D NOODLE_SD_SCK_MHZ=8
    -D NOODLE_INT8_SD_NO_PREDELETE=1
    -D NOODLE_INT8_FUSED_IDENTITY_FAST=1
    -D NOODLE_INT8_SD_PLANE_FAST=1
    -D NOODLE_INT8_SD_PLANE_MAX_BYTES=512



; ============================================================
