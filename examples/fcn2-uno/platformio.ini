[env]
platform = atmelavr
board = nanoatmega328
framework = arduino

; Full 32 KB ATmega328P flash
board_upload.maximum_size = 32768

; USBasp ISP programmer
upload_protocol = usbasp
upload_flags =
  -Pusb
  -B20

; Optional one-time fuse management
extra_scripts = post:pio_usbasp_fullflash.py

; UART debugging still works without a bootloader
monitor_speed = 115200

[env:uno-int8-sd]
build_src_filter =
  -<*>
  +<main2-int8-sd.cpp>

lib_deps =
  prenticedavid/MCUFRIEND_kbv @ ^3.0.0
  adafruit/Adafruit TouchScreen @ ^1.1.4
  adafruit/Adafruit GFX Library @ ^1.11.10
  adafruit/Adafruit BusIO @ ^1.16.1
  greiman/SdFat @ ^2.2.3
  symlink:///home/auralius/works/noodle

build_flags =
  -Os
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_PROGMEM
  -D NOODLE_USE_SDFAT
  -D NOODLE_POOL_MODE=NOODLE_POOL_MEAN
  -D NOODLE_FILE_FORMAT=1
  -D NOODLE_USE_INT8
  -D NOODLE_INT8_FCN_BLOCK=32
  -D NOODLE_INT8_FCN_DEBUG=0
  -D NOODLE_INT8_FCN_PROGRESS=0
  -D SERIAL_RX_BUFFER_SIZE=32
  -D SERIAL_TX_BUFFER_SIZE=16
  -D NOODLE_MEMORY_GUARD=0
  -D NOODLE_ACTIVATION_VERIFY=0
  -D NOODLE_SD_SCK_MHZ=8


[env:uno-fp32-sd]
build_src_filter =
  -<*>
  +<main2-fp32-sd.cpp>

lib_deps =
  prenticedavid/MCUFRIEND_kbv @ ^3.0.0
  adafruit/Adafruit TouchScreen @ ^1.1.4
  adafruit/Adafruit GFX Library @ ^1.11.10
  adafruit/Adafruit BusIO @ ^1.16.1
  greiman/SdFat @ ^2.2.3
  symlink:///home/auralius/works/noodle

build_flags =
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_PROGMEM
  -D NOODLE_USE_SDFAT
  -D NOODLE_FILE_FORMAT=1
  -D NOODLE_POOL_MODE=NOODLE_POOL_MEAN
  -D NOODLE_FCN_BLOCK=8
  -D SERIAL_RX_BUFFER_SIZE=32
  -D SERIAL_TX_BUFFER_SIZE=16
  -D NOODLE_SD_SCK_MHZ=8


[env:uno-int8-pgm]
build_src_filter =
  -<*>
  +<main2-int8-pgm.cpp>

lib_deps =
  prenticedavid/MCUFRIEND_kbv @ ^3.0.0
  adafruit/Adafruit TouchScreen @ ^1.1.4
  adafruit/Adafruit GFX Library @ ^1.11.10
  adafruit/Adafruit BusIO @ ^1.16.1
  greiman/SdFat @ ^2.2.3
  symlink:///home/auralius/works/noodle

build_flags =
  -Os
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_PROGMEM
  -D NOODLE_USE_NONE
  -D NOODLE_POOL_MODE=NOODLE_POOL_MEAN
  -D NOODLE_USE_INT8
  -D NOODLE_INT8_FCN_BLOCK=16
  -D NOODLE_INT8_FCN_DEBUG=0
  -D NOODLE_INT8_FCN_PROGRESS=0
  -D SERIAL_RX_BUFFER_SIZE=32
  -D SERIAL_TX_BUFFER_SIZE=16
  -D NOODLE_MEMORY_GUARD=0
  -D NOODLE_ACTIVATION_VERIFY=0
